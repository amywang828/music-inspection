name: 🚀 部署音樂置換點檢APP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-pages:
    name: 部署前端 → Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: music-inspection
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-worker:
    name: 部署後端 → Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安裝 Wrangler
        run: npm install -g wrangler
      - name: 部署 Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-gcp:
    name: 部署 GCP Cloud Run（auth proxy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安裝 gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: 認證 GCP（authorized_user）
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > /tmp/gcp-creds.json
          gcloud auth login --cred-file=/tmp/gcp-creds.json --quiet
          gcloud config set project c000-493901
      - name: 設定 Docker 認證
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet
      - name: 建置並推送 Docker 映像
        run: |
          docker build -t asia-east1-docker.pkg.dev/c000-493901/cloud-run-source-deploy/music-inspect gcp/
          docker push asia-east1-docker.pkg.dev/c000-493901/cloud-run-source-deploy/music-inspect
      - name: 部署到 Cloud Run
        run: |
          gcloud run deploy music-inspect \
            --image=asia-east1-docker.pkg.dev/c000-493901/cloud-run-source-deploy/music-inspect \
            --region=asia-east1 \
            --platform=managed \
            --port=8080 \
            --quiet
