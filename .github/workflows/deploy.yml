name: 🚀 部署音樂置換點檢APP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-pages:
    name: 部署前端 → Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: music-inspection
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-worker:
    name: 部署後端 → Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安裝 Wrangler
        run: npm install -g wrangler
      - name: 部署 Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-gcp:
    name: 部署 GCP Cloud Run（auth proxy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 取得 GCP Access Token
        id: gcp_token
        run: |
          CREDS='${{ secrets.GCP_CREDENTIALS }}'
          CLIENT_ID=$(echo "$CREDS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['client_id'])")
          CLIENT_SECRET=$(echo "$CREDS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['client_secret'])")
          REFRESH_TOKEN=$(echo "$CREDS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['refresh_token'])")
          ACCESS_TOKEN=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            -H "Content-Type: application/json" \
            -d "{\"client_id\":\"$CLIENT_ID\",\"client_secret\":\"$CLIENT_SECRET\",\"refresh_token\":\"$REFRESH_TOKEN\",\"grant_type\":\"refresh_token\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
      - name: Docker 登入 Artifact Registry
        run: |
          echo "${{ steps.gcp_token.outputs.access_token }}" | \
            docker login -u oauth2accesstoken --password-stdin https://asia-east1-docker.pkg.dev
      - name: 建置並推送 Docker 映像
        run: |
          docker build -t asia-east1-docker.pkg.dev/c000-493901/cloud-run-source-deploy/music-inspect .
          docker push asia-east1-docker.pkg.dev/c000-493901/cloud-run-source-deploy/music-inspect
      - name: 部署到 Cloud Run（REST API）
        run: |
          TOKEN="${{ steps.gcp_token.outputs.access_token }}"
          IMAGE="asia-east1-docker.pkg.dev/c000-493901/cloud-run-source-deploy/music-inspect"
          curl -s -X PATCH \
            "https://run.googleapis.com/v2/projects/c000-493901/locations/asia-east1/services/music-inspect" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"template\":{\"containers\":[{\"image\":\"$IMAGE\"}]},\"annotations\":{\"run.googleapis.com/invoker-iam-disabled\":\"true\",\"run.googleapis.com/ingress\":\"all\"}}" | \
            python3 -c "import sys,json; r=json.load(sys.stdin); print('OK:', r.get('name',''), r.get('error',''))"
