# generated-by: github-action-n
# version: 2.1.8
name: Deploy

on:
  push:
    branches:
      - main

env:
  REGION: asia-east1
  PROJECT_ID: c000-493901
  SERVICE_NAME: music-inspect

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set service name
        id: svc
        run: |
          echo "name=${{ env.SERVICE_NAME }}" >> $GITHUB_OUTPUT

      - name: Check security report
        run: |
          TODAY=$(date +%Y%m%d)
          REPORT=$(ls security-report-${TODAY}-*.docx 2>/dev/null | head -1)
          if [ -z "$REPORT" ]; then
            echo "No security report found. Cannot deploy. Please run security scan first."
            exit 1
          fi
          echo "Security report confirmed: $REPORT"

      - name: Authenticate to Google Cloud (OAuth2)
        id: gcp_token
        run: |
          CREDS='${{ secrets.GCP_CREDENTIALS }}'
          CLIENT_ID=$(echo "$CREDS" | python3 -c "import sys,json,codecs; d=json.loads(codecs.decode(sys.stdin.buffer.read(),'utf-8-sig')); print(d['client_id'])")
          CLIENT_SECRET=$(echo "$CREDS" | python3 -c "import sys,json,codecs; d=json.loads(codecs.decode(sys.stdin.buffer.read(),'utf-8-sig')); print(d['client_secret'])")
          REFRESH_TOKEN=$(echo "$CREDS" | python3 -c "import sys,json,codecs; d=json.loads(codecs.decode(sys.stdin.buffer.read(),'utf-8-sig')); print(d['refresh_token'])")
          ACCESS_TOKEN=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            -H "Content-Type: application/json" \
            -d "{\"client_id\":\"$CLIENT_ID\",\"client_secret\":\"$CLIENT_SECRET\",\"refresh_token\":\"$REFRESH_TOKEN\",\"grant_type\":\"refresh_token\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

      - name: Docker login to Artifact Registry
        run: |
          echo "${{ steps.gcp_token.outputs.access_token }}" | \
            docker login -u oauth2accesstoken --password-stdin https://asia-east1-docker.pkg.dev

      - name: Build and push Docker image
        id: build
        run: |
          IMAGE="asia-east1-docker.pkg.dev/c000-493901/cloud-run-source-deploy/music-inspect"
          docker build -t $IMAGE .
          docker push $IMAGE
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE 2>/dev/null || echo "")
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run (no_traffic)
        run: |
          TOKEN="${{ steps.gcp_token.outputs.access_token }}"
          IMAGE="asia-east1-docker.pkg.dev/c000-493901/cloud-run-source-deploy/music-inspect"
          curl -s -X PATCH \
            "https://run.googleapis.com/v2/projects/c000-493901/locations/asia-east1/services/music-inspect" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"template\":{\"containers\":[{\"image\":\"$IMAGE\"}]},\"annotations\":{\"run.googleapis.com/invoker-iam-disabled\":\"true\",\"run.googleapis.com/ingress\":\"all\"}}" | \
            python3 -c "import sys,json; r=json.load(sys.stdin); print('Deployed:', r.get('name',''), r.get('error',''))"

      - name: Get deployed revision
        id: revision
        run: |
          TOKEN="${{ steps.gcp_token.outputs.access_token }}"
          sleep 10
          REVISION=$(curl -s \
            "https://run.googleapis.com/v2/projects/c000-493901/locations/asia-east1/services/music-inspect" \
            -H "Authorization: Bearer $TOKEN" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('latestCreatedRevision','').split('/')[-1])")
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo "Latest revision: $REVISION"

      - name: Wait for container scan results
        id: scan
        run: |
          PROJECT="${{ env.PROJECT_ID }}"
          DIGEST="${{ steps.build.outputs.digest }}"
          TOKEN="${{ steps.gcp_token.outputs.access_token }}"
          if [ -n "$DIGEST" ]; then
            RESOURCE_URL="https://${DIGEST}"
          else
            RESOURCE_URL="https://asia-east1-docker.pkg.dev/c000-493901/cloud-run-source-deploy/music-inspect"
          fi
          echo "Scanning resource: $RESOURCE_URL"
          MAX_WAIT=900
          INTERVAL=30
          ELAPSED=0
          echo "Waiting for container scan results..."
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            DISCOVERY=$(curl -sf \
              -H "Authorization: Bearer $TOKEN" \
              --get \
              --data-urlencode "filter=kind=\"DISCOVERY\" AND resourceUri=\"${RESOURCE_URL}\"" \
              "https://containeranalysis.googleapis.com/v1/projects/${PROJECT}/occurrences" \
              2>/dev/null || echo "")
            STATUS=$(echo "$DISCOVERY" | python3 -c "import sys,json; d=json.load(sys.stdin); os=d.get('occurrences',[]); print(os[0].get('discovery',{}).get('analysisStatus','') if os else '')" 2>/dev/null || echo "")
            echo "Discovery status: $STATUS (${ELAPSED}s elapsed)"
            if [ "$STATUS" = "FINISHED_SUCCESS" ] || [ "$STATUS" = "FINISHED_FAILED" ]; then
              echo "Scan complete!"
              VULN=$(curl -sf \
                -H "Authorization: Bearer $TOKEN" \
                --get \
                --data-urlencode "filter=kind=\"VULNERABILITY\" AND resourceUri=\"${RESOURCE_URL}\"" \
                "https://containeranalysis.googleapis.com/v1/projects/${PROJECT}/occurrences" \
                2>/dev/null || echo "")
              COUNT=$(echo "$VULN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('occurrences',[])))" 2>/dev/null || echo "0")
              HIGH=$(echo "$VULN" | python3 -c "import sys,json;d=json.load(sys.stdin);print(sum(1 for o in d.get('occurrences',[]) if o.get('vulnerability',{}).get('severity','') in ['CRITICAL','HIGH','MEDIUM'] or (o.get('vulnerability',{}).get('severity','') in ['LOW','MINIMAL','','SEVERITY_UNSPECIFIED'] and any(p.get('fixedVersion',{}).get('name','') not in ['','none'] for p in o.get('vulnerability',{}).get('packageIssue',[])))))" 2>/dev/null || echo "0")
              WARN=$(echo "$VULN" | python3 -c "import sys,json;d=json.load(sys.stdin);print(sum(1 for o in d.get('occurrences',[]) if o.get('vulnerability',{}).get('severity','') in ['LOW','MINIMAL','','SEVERITY_UNSPECIFIED'] and not any(p.get('fixedVersion',{}).get('name','') not in ['','none'] for p in o.get('vulnerability',{}).get('packageIssue',[]))))" 2>/dev/null || echo "0")
              echo "Found $COUNT vulnerabilities: $HIGH blocking, $WARN warning-only."
              echo "count=$COUNT" >> $GITHUB_OUTPUT
              echo "high=$HIGH" >> $GITHUB_OUTPUT
              echo "warn=$WARN" >> $GITHUB_OUTPUT
              break
            fi
          done
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "SCAN_TIMEOUT=true" >> $GITHUB_ENV
            echo "count=-1" >> $GITHUB_OUTPUT
            echo "high=0" >> $GITHUB_OUTPUT
            echo "warn=0" >> $GITHUB_OUTPUT
            echo "⚠️ 掃描逾時（IAM 權限不足或 API 無回應），跳過掃描直接部署。請聯絡管理員授予 containeranalysis.occurrences.viewer 角色。"
          fi

      - name: Open traffic if scan passed
        if: steps.scan.outputs.high == '0'
        run: |
          TOKEN="${{ steps.gcp_token.outputs.access_token }}"
          REVISION="${{ steps.revision.outputs.revision }}"
          curl -s -X PATCH \
            "https://run.googleapis.com/v2/projects/c000-493901/locations/asia-east1/services/music-inspect" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"traffic\":[{\"revision\":\"$REVISION\",\"percent\":100}]}" | \
            python3 -c "import sys,json; r=json.load(sys.stdin); print('Traffic updated:', r.get('name',''), r.get('error',''))"
          echo "========================================="
          echo "Deployed! Service: music-inspect"
          echo "URL: https://music-inspect-403438157899.asia-east1.run.app"
          echo "========================================="

      - name: Warn for unfixable low severity
        if: steps.scan.outputs.high == '0' && steps.scan.outputs.warn != '0'
        run: |
          echo "⚠️ 注意：發現 ${{ steps.scan.outputs.warn }} 個低風險漏洞（無可用修復版本），不影響部署，建議持續追蹤。"

      - name: Keep traffic at 0 if scan failed
        if: steps.scan.outputs.high != '0'
        run: |
          echo "Blocking vulnerabilities found (${{ steps.scan.outputs.high }} blocking). Traffic remains at 0%."
          exit 1
